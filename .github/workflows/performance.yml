name: Navigation and performance
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Navigation contracts
        run: dotnet run --project tests/VisualizeScene.Navigation.Tests -c Release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navigation-contracts
          path: artifacts/validation/navigation.xml
          if-no-files-found: error
