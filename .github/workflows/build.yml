name: Build and validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run core conformance
        run: dotnet run --project tests/VisualizeScene.Tests -c Release
      - name: Run editor interaction regressions
        run: dotnet run --project tests/VisualizeScene.Editing.Tests -c Release
      - name: Run placement, snapping and selection regressions
        run: dotnet run --project tests/VisualizeScene.Parity.Tests -c Release
      - name: Run touch and keyboard navigation regressions
        run: dotnet run --project tests/VisualizeScene.Navigation.Tests -c Release
      - name: Run bounded text layout regressions
        run: dotnet run --project tests/VisualizeScene.Rendering.Tests -c Release
      - name: Performance correctness and allocation contracts
        run: dotnet run --project tests/VisualizeScene.Performance.Tests -c Release
      - name: Build reusable packages
        run: |
          mkdir -p artifacts/packages
          for project in src/*/*.csproj; do
            case "$project" in *Controls.Uno*) continue;; esac
            dotnet pack "$project" -c Release -o artifacts/packages
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance
          path: artifacts/validation
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages
      - name: Source archive
        if: always()
        run: mkdir -p artifacts/source && git archive HEAD -o artifacts/source/VisualizeScene-source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source
          path: artifacts/source
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install WebAssembly workload
        run: dotnet workload install wasm-tools --skip-manifest-update
      - name: Build desktop
        run: dotnet build samples/VisualizeScene.Workbench -c Release -f net10.0-desktop
      - name: Publish browser
        run: dotnet publish samples/VisualizeScene.Workbench -c Release -f net10.0-browserwasm -p:WasmShellWebAppBasePath=/VisualizeScene/ -o artifacts/browser-publish
      - name: Stage browser site
        run: |
          index=$(find artifacts/browser-publish -type f -name index.html | head -n 1)
          test -n "$index"
          mkdir -p artifacts/site/VisualizeScene
          cp -a "$(dirname "$index")"/. artifacts/site/VisualizeScene/
          touch artifacts/site/VisualizeScene/.nojekyll
          printf '{"commit":"%s","run":"%s","repository":"%s"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY" > artifacts/site/VisualizeScene/build-info.json
      - uses: actions/upload-artifact@v4
        with:
          name: browser
          path: artifacts/site/VisualizeScene
          include-hidden-files: true
      - name: Package Uno controls
        run: |
          dotnet pack src/VisualizeScene.Controls.Uno -c Release -p:IsPackable=true -o artifacts/uno-packages
          test "$(find artifacts/uno-packages -name '*.nupkg' | wc -l)" -gt 0
      - uses: actions/upload-artifact@v4
        with:
          name: uno-controls
          path: artifacts/uno-packages
          if-no-files-found: error
      - name: Install browser test dependencies
        id: browser_deps
        run: python -m pip install playwright && python -m playwright install --with-deps chromium
      - name: Browser interactions
        run: |
          python -m http.server 8080 --directory artifacts/site >/tmp/visualizescene-http.log 2>&1 &
          python tests/browser/interaction.py http://127.0.0.1:8080/VisualizeScene/?test=1
      - name: Browser ports, reconnection and modal labels
        if: ${{ !cancelled() && steps.browser_deps.outcome == 'success' }}
        run: python tests/browser/editing.py http://127.0.0.1:8080/VisualizeScene/?test=1
      - name: Browser automatic label placement and alignment guides
        if: ${{ !cancelled() && steps.browser_deps.outcome == 'success' }}
        run: python tests/browser/placement.py http://127.0.0.1:8080/VisualizeScene/?test=1
      - name: Browser area selection, previews and topology commands
        if: ${{ !cancelled() && steps.browser_deps.outcome == 'success' }}
        run: python tests/browser/selection.py http://127.0.0.1:8080/VisualizeScene/?test=1
      - name: Browser touch and keyboard navigation
        if: ${{ !cancelled() && steps.browser_deps.outcome == 'success' }}
        run: python tests/browser/navigation.py http://127.0.0.1:8080/VisualizeScene/?test=1
      - name: Browser large-document performance contracts
        if: ${{ !cancelled() && steps.browser_deps.outcome == 'success' }}
        run: python tests/browser/performance.py http://127.0.0.1:8080/VisualizeScene/?test=1
      - name: Browser layouts, analysis, exports and samples
        if: ${{ !cancelled() && steps.browser_deps.outcome == 'success' }}
        run: python tests/browser/features.py http://127.0.0.1:8080/VisualizeScene/?test=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-validation
          path: artifacts/browser-validation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-features
          path: artifacts/browser-features
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-editing
          path: artifacts/browser-editing

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-placement
          path: artifacts/browser-placement

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-selection
          path: artifacts/browser-selection

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-navigation
          path: artifacts/browser-navigation

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-performance
          path: artifacts/browser-performance

  package-consumers:
    needs: [core, app]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install WebAssembly workload
        run: dotnet workload install wasm-tools --skip-manifest-update
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts/package-feed
      - uses: actions/download-artifact@v4
        with:
          name: uno-controls
          path: artifacts/package-feed
      - name: Validate isolated NuGet consumers
        run: python tests/packages/validate.py artifacts/package-feed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-validation
          path: artifacts/package-validation
          if-no-files-found: error
